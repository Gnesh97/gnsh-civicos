<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>CivicOS Operations</title>
    <style>
      /* Civic Ledger visual system: Swiss grid + restrained liquid glass. */
      :root {
        font-family: 'IBM Plex Sans', 'Hanken Grotesk', 'Barlow', 'Host Grotesk', 'DM Sans', ui-sans-serif, system-ui, sans-serif;
        color: #f2f4f7;
        background: transparent !important;
        --page: #0b0e13;
        --surface: rgba(22, 28, 37, .72);
        --surface-strong: rgba(28, 35, 46, .9);
        --ink: #f2f4f7;
        --ink-dim: rgba(242, 244, 247, .68);
        --ink-muted: rgba(242, 244, 247, .42);
        --line: rgba(242, 244, 247, .12);
        --line-strong: rgba(242, 244, 247, .22);
        --accent: #8ca9ff;
        --accent-strong: #6d8dff;
        --accent-wash: rgba(140, 169, 255, .14);
        --danger: #ffb1b1;
        --shadow: 0 24px 80px rgba(0, 0, 0, .34);
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      /* Remove the CEF surface itself while the NUI is closed. */
      html { display: none; background: transparent !important; }
      html.civicos-visible { display: block; background: transparent !important; }
      body { display: none; min-height: 100vh; margin: 0; background: transparent !important; visibility: hidden; opacity: 0; pointer-events: none; }
      body.civicos-visible {
        display: block;
        overflow-x: auto;
        color: var(--ink);
        background: var(--page) !important;
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }
      body:not(.civicos-visible) #root { display: none !important; }
      body.civicos-visible::after {
        position: fixed;
        top: 0;
        left: 9vw;
        width: 1px;
        height: 100vh;
        pointer-events: none;
        content: '';
        background: linear-gradient(to bottom, rgba(140, 169, 255, .64), transparent 45%);
        opacity: .52;
      }
      h1, h2, p { margin: 0; }
      h1, h2 { font-weight: 400; letter-spacing: -.025em; text-wrap: balance; }
      h1 { font-size: clamp(1.32rem, 2vw, 1.7rem); line-height: 1; }
      h2 { font-size: clamp(1.14rem, 1.6vw, 1.38rem); line-height: 1.15; }
      .muted { color: var(--ink-dim); font-size: .79rem; line-height: 1.55; }
      .grid { display: grid; }
      button, input, select, textarea { font: inherit; }
      button {
        min-height: 44px;
        min-width: 44px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: #10131a;
        font-size: .82rem;
        font-weight: 600;
        letter-spacing: .01em;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease, color 180ms ease;
      }
      button:hover { background: #b4c5ff; transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button.secondary { border-color: var(--line-strong); background: rgba(255, 255, 255, .045); color: var(--ink); backdrop-filter: blur(18px) saturate(130%); }
      button.secondary:hover { border-color: rgba(140, 169, 255, .5); background: var(--accent-wash); }
      button:disabled { cursor: wait; opacity: .58; transform: none; box-shadow: none; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      #root {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(280px, .8fr);
        gap: 16px;
        width: min(100%, 1440px);
        /* FiveM is a desktop NUI: keep the two-column workbench intact and
           let unusually narrow debug windows scroll horizontally. */
        min-width: 1040px;
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(22px, 4vw, 58px) clamp(18px, 5vw, 72px) 72px;
        isolation: isolate;
      }
      #root::before { position: absolute; top: 0; left: clamp(18px, 5vw, 72px); right: clamp(18px, 5vw, 72px); height: 1px; content: ''; background: linear-gradient(90deg, var(--accent), rgba(140, 169, 255, 0) 70%); opacity: .7; }
      body.civicos-visible #root { animation: shell-in 560ms cubic-bezier(.22, 1, .36, 1) both; }
      header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 64px; margin: 0 0 10px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
      header > div:first-child { display: flex; align-items: center; gap: 14px; min-width: 0; }
      header > div:first-child::before { display: block; width: 30px; height: 30px; content: ''; border: 1px solid rgba(140, 169, 255, .6); background: linear-gradient(to top, var(--accent) 0 28%, transparent 28% 37%, var(--accent) 37% 64%, transparent 64% 73%, var(--accent) 73%); box-shadow: inset 0 0 16px rgba(255, 255, 255, .06); }
      header > div:first-child .muted { margin-top: 5px; }
      header > button { display: inline-flex; align-items: center; justify-content: center; order: 3; }
      header::after { align-self: flex-start; order: 2; min-height: 34px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .035); color: var(--ink-dim); content: 'CIVIC / NUI'; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; backdrop-filter: blur(18px) saturate(125%); }
      #stats { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; margin: 0 0 10px; }
      .card { position: relative; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(31, 38, 49, .78), rgba(16, 21, 29, .78)); box-shadow: var(--shadow); backdrop-filter: blur(26px) saturate(125%); }
      .card::before { position: absolute; top: 0; right: 18px; left: 18px; height: 1px; content: ''; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .2), transparent); opacity: .65; }
      #stats .card { padding: 18px 20px 20px; box-shadow: none; background: rgba(20, 26, 34, .62); }
      #stats .card::after { position: absolute; right: 20px; bottom: 20px; width: 30px; height: 1px; content: ''; background: var(--accent); opacity: .6; }
      #stats .muted { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; }
      .stat { margin-top: 10px; color: var(--ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: clamp(1.35rem, 3vw, 2.2rem); font-weight: 400; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
      .requests-panel { grid-column: 1; grid-row: 3; min-height: 360px; padding: clamp(20px, 3vw, 30px); }
      .composer-panel { grid-column: 2; grid-row: 3; padding: clamp(20px, 3vw, 30px); }
      .operations-panel { grid-column: 1 / -1; grid-row: 4; padding: clamp(20px, 3vw, 30px); }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 18px; }
      .toolbar h2 { flex: 1; min-width: 160px; }
      .toolbar h2[style] { flex: 1 !important; }
      .toolbar::before { width: 18px; height: 1px; content: ''; background: var(--accent); }
      .toolbar > h2 { order: 2; }
      .toolbar > button { order: 3; }
      .toolbar > h2 + button { margin-left: auto; }
      .card > .toolbar:first-child::before { display: none; }
      .card > .toolbar:first-child::after { align-self: center; width: 18px; height: 1px; content: ''; background: var(--accent); order: 1; }
      .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      button.small { min-height: 44px; padding: 7px 11px; border-radius: 8px; font-size: .7rem; }
      input, select, textarea { min-height: 46px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 11px 12px; background: rgba(7, 10, 15, .35); color: var(--ink); font-size: .83rem; line-height: 1.4; transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease; }
      input:hover, select:hover, textarea:hover { border-color: rgba(140, 169, 255, .42); }
      input:focus, select:focus, textarea:focus { border-color: var(--accent); background: rgba(7, 10, 15, .55); outline: none; }
      input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      form { display: flex; flex-direction: column; gap: 16px; }
      form label { display: flex; flex-direction: column; gap: 7px; color: var(--ink-dim); font-size: .75rem; }
      textarea { min-height: 132px; resize: vertical; }
      form .toolbar { align-items: center; justify-content: flex-start; padding-top: 4px; }
      form .toolbar::before { display: none; }
      table { width: 100%; min-width: 580px; border-collapse: collapse; }
      th, td { padding: 13px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: .78rem; vertical-align: middle; }
      th { color: var(--ink-muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .62rem; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; }
      td { color: var(--ink-dim); }
      tbody tr { transition: background-color 180ms ease; }
      tbody tr:hover { background: rgba(140, 169, 255, .05); }
      td:first-child { color: var(--ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .7rem; font-variant-numeric: tabular-nums; }
      .pill { display: inline-flex; align-items: center; min-height: 25px; border: 1px solid rgba(140, 169, 255, .3); border-radius: 999px; padding: 4px 9px; background: var(--accent-wash); color: var(--accent); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .63rem; letter-spacing: .03em; }
      .error { margin: 0 0 14px; padding: 10px 12px; border: 1px solid rgba(255, 177, 177, .3); border-radius: 9px; background: rgba(255, 177, 177, .08); color: var(--danger); font-size: .78rem; line-height: 1.45; }
      #error:empty { display: none; }
      .empty { padding: 30px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink-muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .72rem; }
      #requests, #workorders { overflow-x: auto; }
      #operations .muted { max-width: 60ch; margin-bottom: 18px !important; }
      .workorder-stack { display: grid; gap: 10px; }
      .workorder-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(7, 10, 15, .24); transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease; }
      .workorder-card:hover, .workorder-card.is-selected { border-color: rgba(140, 169, 255, .46); background: rgba(140, 169, 255, .06); box-shadow: inset 3px 0 0 var(--accent); }
      .workorder-card-main { min-width: 0; }
      .workorder-card-top, .workorder-card-meta, .workorder-card-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .workorder-card-top { margin-bottom: 7px; }
      .workorder-reference, .workorder-version, .detail-kicker { color: var(--ink-muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .63rem; letter-spacing: .08em; text-transform: uppercase; }
      .workorder-card h3 { margin: 0 0 9px; color: var(--ink); font-size: .98rem; font-weight: 500; letter-spacing: -.01em; }
      .workorder-card-meta { color: var(--ink-dim); font-size: .75rem; }
      .workorder-card-meta span + span { padding-left: 10px; border-left: 1px solid var(--line); }
      .workorder-card-actions { justify-content: flex-end; }
      .workorder-card-actions .small { white-space: nowrap; }
      .detail-workspace { margin-top: 18px; padding-top: 20px; border-top: 1px solid var(--line-strong); }
      .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .detail-header h3 { margin: 6px 0 0; color: var(--ink); font-size: 1.15rem; font-weight: 400; }
      .detail-header .muted { margin: 5px 0 0 !important; }
      .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .detail-card { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(28, 35, 46, .54); }
      .detail-card h4 { margin: 0 0 13px; color: var(--ink); font-size: .84rem; font-weight: 500; }
      .detail-card .detail-card-subtitle { margin: -8px 0 13px; color: var(--ink-muted); font-size: .7rem; }
      .detail-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .detail-list li { display: flex; align-items: flex-start; gap: 9px; min-height: 30px; color: var(--ink-dim); font-size: .76rem; line-height: 1.4; }
      .detail-list input[type='checkbox'] { flex: 0 0 auto; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent-strong); }
      .detail-list label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
      .detail-list label.is-complete { color: var(--ink); }
      .detail-empty { color: var(--ink-muted); font-size: .74rem; line-height: 1.5; }
      .detail-actions { display: grid; gap: 8px; }
      .detail-action-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
      .detail-action-row:last-child { padding-bottom: 0; border-bottom: 0; }
      .detail-action-label { min-width: 0; color: var(--ink-dim); font-size: .75rem; }
      .detail-action-label strong { display: block; color: var(--ink); font-weight: 500; }
      .detail-action-label span { display: block; margin-top: 2px; color: var(--ink-muted); font-size: .66rem; }
      .detail-action-row button { flex: 0 0 auto; }
      .detail-inspection { display: grid; gap: 12px; }
      .detail-inspection-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .detail-note { width: 100%; min-height: 74px; margin-top: 2px; resize: vertical; }
      .detail-alert { margin: 0 0 14px; }
      .detail-loading { color: var(--ink-muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .72rem; }
      .detail-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
      .detail-footer .muted { margin: 0 !important; }
      .form-note { margin: -4px 0 0; color: var(--ink-muted); font-size: .7rem; line-height: 1.45; }
      [hidden] { display: none !important; }
      @keyframes shell-in { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <!--
      THESIS: CivicOS is a service ledger, not a generic dashboard; the queue stays readable while actions stay close.
      OWN-WORLD: Swiss grid, cobalt ink, tabular numerics, and a restrained liquid-glass layer for active controls.
      STORY: A citizen sees requests; staff see the same queue with authorized operations; everyone knows current state first.
      FIRST VIEWPORT: Identity rail, three role-aware measures, request queue, and new-request form share one desktop workbench.
      FORM: Swiss service ledger, candidate 3 of grounded directions; seed d43d9f59.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <main id="root">
      <header class="topbar">
        <div><h1>CivicOS</h1><p class="muted" id="subtitle">Municipal operations</p></div>
        <button class="secondary" id="close">Close</button>
      </header>
      <section class="grid stats-grid" id="stats" aria-label="CivicOS overview"></section>
      <section class="card requests-panel" aria-labelledby="requests-heading">
        <div class="toolbar"><h2 id="requests-heading" style="flex:1">Requests</h2><button id="refresh">Refresh</button></div>
        <div id="error" class="error" aria-live="polite"></div>
        <div id="requests" class="empty">Loading…</div>
      </section>
      <section class="card operations-panel" id="operations" aria-labelledby="operations-heading" hidden>
        <div class="toolbar"><h2 id="operations-heading" style="flex:1">Operations</h2><button class="secondary" id="workorders-refresh">Refresh work orders</button></div>
        <p class="muted" style="margin-bottom:12px">Staff actions are checked again by the server before they are applied.</p>
        <div id="workorders" class="empty">Loading…</div>
        <div id="workorder-detail" class="detail-workspace" hidden aria-live="polite"></div>
      </section>
      <section class="card composer-panel" aria-labelledby="new-request-heading">
        <h2 id="new-request-heading" style="margin-bottom:12px">New request</h2>
        <form id="request-form">
          <label class="muted" for="service">Service</label><select id="service" required></select>
          <label class="muted" for="title">Title</label><input id="title" maxlength="120" required />
          <label class="muted" for="description">Description</label><textarea id="description" maxlength="4000" required></textarea>
          <p class="form-note">Your current in-game position is attached to the request for field routing.</p>
          <div class="toolbar"><button type="submit">Submit request</button><span class="muted" id="form-status" aria-live="polite"></span></div>
        </form>
      </section>
    </main>
    <script>
      const state = {
        bootstrap: null,
        requests: [],
        workorders: [],
        open: false,
        selectedWorkorderId: null,
        workorderDetails: {},
      };
      const resource = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'gnsh-civicos';
      const mock = typeof GetParentResourceName !== 'function';
      let nuiSequence = 0;
      const pendingNui = new Map();
      const NUI_TIMEOUT_MS = 15000;
      const nui = (operation, payload = {}) => {
        const requestId = `web-${Date.now()}-${nuiSequence++}`;
        const timeoutId = window.setTimeout(() => {
          const pending = pendingNui.get(requestId);
          if (!pending) return;
          pendingNui.delete(requestId);
          applyMessage({ type: 'civicos:api:result', requestId, operation: pending.operation, payload: pending.payload, result: { ok: false, error: { code: 'NUI_TIMEOUT', message: 'NUI request timed out.' } } });
        }, NUI_TIMEOUT_MS);
        pendingNui.set(requestId, { operation, payload, timeoutId });
        return fetch(`https://${resource}/civicos:api`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ operation, payload, requestId }) }).catch(() => {
          const pending = pendingNui.get(requestId);
          if (!pending) return { ok: false };
          pendingNui.delete(requestId);
          window.clearTimeout(pending.timeoutId);
          applyMessage({ type: 'civicos:api:result', requestId, operation: pending.operation, payload: pending.payload, result: { ok: false, error: { code: 'NUI_TRANSPORT_FAILED', message: 'NUI request failed.' } } });
          return { ok: false };
        });
      };
      const setError = (message = '') => { document.getElementById('error').textContent = message; };
      const setFormStatus = (message = '') => { document.getElementById('form-status').textContent = message; };
      const apiErrorMessage = (result, fallback = 'The request could not be completed.') => {
        const error = result?.error || {};
        const detailValue = (value) => {
          if (Array.isArray(value)) return value.join(', ');
          if (value && typeof value === 'object') return Object.entries(value).map(([key, item]) => `${key}:${detailValue(item)}`).join(', ');
          return String(value);
        };
        const details = error.details && typeof error.details === 'object'
          ? Object.entries(error.details).map(([key, value]) => `${key}=${detailValue(value)}`).join(', ')
          : '';
        return [error.message || error.code || fallback, details ? `(${details})` : ''].filter(Boolean).join(' ');
      };
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      const humanizeKey = (value) => String(value || '—').replace(/^service\./, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, (letter) => letter.toUpperCase()) || '—';
      const identityRole = () => state.bootstrap?.identity?.role || 'CITIZEN';
      const permissions = () => {
        const value = state.bootstrap?.permissions;
        if (Array.isArray(value)) return value;
        if (!value || typeof value !== 'object') return [];
        return Object.keys(value).filter((key) => /^\d+$/.test(key)).sort((left, right) => Number(left) - Number(right)).map((key) => value[key]);
      };
      const can = (permission) => permissions().includes(permission) || identityRole() === 'SYSTEM_ADMIN';
      const isStaff = () => ['TECHNICIAN', 'DISPATCHER', 'SUPERVISOR', 'DEPARTMENT_ADMIN', 'SYSTEM_ADMIN'].includes(identityRole());
      const actionButton = ({ operation, id = 0, version = 0, label, targetStatus = '', serviceCode = '', actionKey = '', proofValue = '', notesFor = '', secondary = false, disabled = false }) => `<button class="small${secondary ? ' secondary' : ''}" data-operation="${escapeHtml(operation)}" data-id="${Number(id) || 0}" data-version="${Number(version) || 0}" data-target-status="${escapeHtml(targetStatus)}" data-service-code="${escapeHtml(serviceCode)}" data-action-key="${escapeHtml(actionKey)}" data-proof="${escapeHtml(proofValue)}" data-notes-for="${Number(notesFor) || 0}"${disabled ? ' disabled' : ''}>${escapeHtml(label)}</button>`;
      const setVisible = (visible) => {
        const nextVisible = Boolean(visible);
        state.open = nextVisible;
        document.documentElement.classList.toggle('civicos-visible', nextVisible);
        document.body.classList.toggle('civicos-visible', nextVisible);
        document.body.hidden = !nextVisible;
        document.body.setAttribute('aria-hidden', String(!nextVisible));
        if (nextVisible) load();
      };
      const objectValue = (value) => {
        if (value && typeof value === 'object') return value;
        if (typeof value === 'string') { try { const parsed = JSON.parse(value); return parsed && typeof parsed === 'object' ? parsed : {}; } catch (_) { return {}; } }
        return {};
      };
      const workorderTemplate = (workorder) => objectValue(objectValue(workorder?.metadata).template);
      const inspectionRequired = (workorder) => workorderTemplate(workorder).inspectionRequired === true;
      const formatDuration = (milliseconds) => {
        const seconds = Math.max(1, Math.round(Number(milliseconds || 0) / 1000));
        return `${seconds}s field step`;
      };
      const getWorkorder = (id) => state.workorders.find((item) => Number(item.id) === Number(id));
      const ensureDetail = (workorder) => {
        if (!workorder) return null;
        const id = Number(workorder.id);
        const current = state.workorderDetails[id] || { workorderId: id, version: Number(workorder.version) || 0, checklist: null, actions: null, inspection: null, activeActions: {}, loading: false, error: '', inspectionUnavailable: false };
        if (!state.workorderDetails[id]) state.workorderDetails[id] = current;
        if (!current.mutating) current.version = Number(workorder.version) || current.version;
        return current;
      };
      const setWorkorderVersion = (id, version, status = '') => {
        const workorder = getWorkorder(id);
        const detail = workorder ? ensureDetail(workorder) : state.workorderDetails[id];

          nui(operation, { workorderId: id, token: button.dataset.proof, actionKey: button.dataset.actionKey, expectedVersion, result: { source: 'civicos-nui' } });
        }
      };
      const handleChecklistChange = (event) => {
        const input = event.target.closest('[data-operation="checklist.update"]');
        if (!input || mock) return;
        const detail = state.workorderDetails[state.selectedWorkorderId];
        if (detail) detail.mutating = true;
        input.disabled = true;
        let value = input.dataset.valueType === 'boolean' ? input.checked : input.value;
        if (input.dataset.valueType === 'numeric') value = Number(value);
        nui('checklist.update', { workorderId: Number(input.dataset.id), expectedVersion: Number(input.dataset.version), key: input.dataset.key, value });
      };
      document.getElementById('requests').addEventListener('click', handleAction);
      document.getElementById('workorders').addEventListener('click', handleAction);
      document.getElementById('workorder-detail').addEventListener('click', handleAction);
      document.getElementById('workorder-detail').addEventListener('change', handleChecklistChange);
      document.getElementById('close').addEventListener('click', () => {
        setVisible(false);
        if (!mock) fetch(`https://${resource}/civicos:close`, { method: 'POST', body: '{}' }).catch(() => undefined);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || !state.open) return;
        document.getElementById('close').click();
      });
      document.getElementById('request-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        setFormStatus('Submitting…');
        if (mock) { setFormStatus('Saved in mock mode'); return; }
        nui('request.create', { serviceCode: document.getElementById('service').value, title: document.getElementById('title').value, description: document.getElementById('description').value });
      });
      // The first client close message can arrive before this listener is ready; establish a closed state locally.
      setVisible(mock);
    </script>
  </body>
</html>
